<!DOCTYPE html>
<html lang="zh-CN" data-theme="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朋友说 · 项目导航</title>
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="site/assets/index.css">
</head>
<body>
<div class="bg-layer">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="bg-grain"></div>
</div>

<main class="section" style="min-height:100vh;display:flex;align-items:center">
  <div class="wrap center">
    <span class="section-kicker">FRIEND WALL</span>
    <h1 class="section-title" style="font-size:clamp(32px,6vw,56px);margin-bottom:16px">朋友说</h1>
    <p class="section-sub" style="margin-bottom:52px">个人评价墙 · 三端应用 · 选择要进入的端</p>

    <div class="nav-grid">
      <a class="nav-card glass" href="site/">
        <span class="nc-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg></span>
        <strong>官网展示端</strong>
        <em class="dim">给所有访客看的门面：沉浸式首屏 + 星图评价墙</em>
        <span class="nc-go">进入 →</span>
      </a>
      <a class="nav-card glass" href="write/">
        <span class="nc-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
        <strong>朋友填写端</strong>
        <em class="dim">朋友自助留言：写评价、传头像、打分</em>
        <span class="nc-go">进入 →</span>
      </a>
      <a class="nav-card glass" href="admin/">
        <span class="nc-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/><circle cx="12" cy="15" r="1.6"/></svg></span>
        <strong>站长后台</strong>
        <em class="dim">审核发布、管理留言、编辑资料（密码 admin123）</em>
        <span class="nc-go">进入 →</span>
      </a>
    </div>
  </div>
</main>

<style>
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:920px;margin:0 auto}
.nav-card{padding:34px 30px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:var(--trans);border-radius:var(--radius)}
.nav-card:hover{transform:translateY(-6px);border-color:var(--a1);box-shadow:0 24px 60px -22px var(--glow1)}
.nc-ic{color:var(--a1);margin-bottom:4px;display:block}
.nav-card strong{font-family:var(--font-display);font-size:20px}
.nav-card em{font-style:normal;font-size:14px;line-height:1.7}
.nc-go{margin-top:8px;font-size:14px;font-weight:600;color:var(--a1)}
</style>
</body>
</html>
